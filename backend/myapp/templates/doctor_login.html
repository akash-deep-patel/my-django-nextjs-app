<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login</title>
</head>
<body>
    <h1>Welcome, {{doctor.name}}</h1>
    <h2>Available Doctors:</h2>
    <ul>
        {% for patient in patients %}
            <li>{{ patient.name }} - {{ patient.age }}</li>
        {% endfor %}
    </ul>
</body>
</html>
