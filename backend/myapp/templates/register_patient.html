<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Patient</title>
</head>
<body>
    <h1>Register as Patient</h1>
    <form method="post">
        {% csrf_token %}
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>

        <label for="age">Age:</label>
        <input type="age" id="age" name="age" required><br>

        <label for="gender">Gender:</label>
        <input type="gender" id="gender" name="gender" required><br>

        <label for="address">Address:</label>
        <input type="address" id="address" name="address" required><br>

        <label for="phone">Phone:</label>
        <input type="phone" id="phone" name="phone" required><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
